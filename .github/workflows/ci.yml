name: CI — MegaHUB

# Verificación en cada PR y en cada push a main. NO compila el .exe: electron-builder
# --win necesita Windows + firma y es lento/caro por PR (igual que el APK de DERIVA,
# el .exe sigue siendo checkpoint manual). Hoy solo lint; los tests entran en M26.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-mh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lint en modo "verja de baseline": pasa la deuda heredada, falla si sube.
      # Ver scripts/lint-ci.mjs y .lint-baseline.json.
      - name: Lint (no debe empeorar el baseline)
        run: npm run lint:ci
